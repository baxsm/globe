name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # the conformance suite validates against the real XSDs through libxml2 and
      # fails rather than skips when the validator is missing
      - name: Install lxml
        run: pip install "lxml==6.1.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the committed schema fixtures are byte identical to the published ones
        run: bun run verify:schema

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bunx --bun @biomejs/biome check src scripts vitest.config.ts

      - name: Test
        run: bun run test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The suite runs against a real Postgres and the real engine. Mocking either would
    # remove the boundary this phase exists to test.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: globe
          POSTGRES_PASSWORD: globe
          POSTGRES_DB: globe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://globe:globe@localhost:5432/globe_test
      TEST_DATABASE_URL: postgres://globe:globe@localhost:5432/globe_test
      SESSION_SECRET: ci-session-secret-at-least-thirty-two-chars

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # The backend imports the engine's TypeScript source through a path alias, so the
      # engine's own dependencies have to be present or every import of it fails to
      # resolve. Installing only the backend's leaves `decimal.js` missing.
      - name: Install engine dependencies
        working-directory: engine
        run: bun install --frozen-lockfile

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations
        run: bun run db:migrate

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bunx --bun @biomejs/biome check src drizzle.config.ts vitest.config.ts

      - name: Test
        run: bun run test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    # The e2e suite drives the real app against the real API against a real Postgres.
    # A mocked backend here would pass while the contract between them was broken,
    # which is the failure this job exists to catch.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: globe
          POSTGRES_PASSWORD: globe
          POSTGRES_DB: globe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://globe:globe@localhost:5432/globe_test
      SESSION_SECRET: ci-session-secret-at-least-thirty-two-chars
      NEXT_PUBLIC_API_URL: http://localhost:3001
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install engine dependencies
        working-directory: engine
        run: bun install --frozen-lockfile

      - name: Install backend dependencies
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Apply migrations
        working-directory: backend
        run: bun run db:migrate

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx --yes @biomejs/biome@2.5.8 check src

      - name: Unit and component tests
        run: npm run test

      - name: Build
        env:
          SKIP_ENV_VALIDATION: "true"
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Both services run for the e2e suite. `next start` serves the production build
      # rather than dev, so what the tests drive is what would ship.
      - name: Start the API
        working-directory: backend
        run: bun run src/index.ts &

      - name: Start the app
        run: npm run start &

      - name: Wait for both to answer
        run: |
          npx --yes wait-on@8.0.1 http://localhost:3001/health http://localhost:3000/login

      - name: End to end
        run: npx playwright test flow
