name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # the conformance suite validates against the real XSDs through libxml2 and
      # fails rather than skips when the validator is missing
      - name: Install lxml
        run: pip install "lxml==6.1.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the committed schema fixtures are byte identical to the published ones
        run: bun run verify:schema

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bunx --bun @biomejs/biome check src scripts vitest.config.ts

      - name: Test
        run: bun run test
