name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # the conformance suite validates against the real XSDs through libxml2 and
      # fails rather than skips when the validator is missing
      - name: Install lxml
        run: pip install "lxml==6.1.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the committed schema fixtures are byte identical to the published ones
        run: bun run verify:schema

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bunx --bun @biomejs/biome check src scripts vitest.config.ts

      - name: Test
        run: bun run test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The suite runs against a real Postgres and the real engine. Mocking either would
    # remove the boundary this phase exists to test.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: globe
          POSTGRES_PASSWORD: globe
          POSTGRES_DB: globe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://globe:globe@localhost:5432/globe_test
      TEST_DATABASE_URL: postgres://globe:globe@localhost:5432/globe_test
      SESSION_SECRET: ci-session-secret-at-least-thirty-two-chars

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # The backend imports the engine's TypeScript source through a path alias, so the
      # engine's own dependencies have to be present or every import of it fails to
      # resolve. Installing only the backend's leaves `decimal.js` missing.
      - name: Install engine dependencies
        working-directory: engine
        run: bun install --frozen-lockfile

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations
        run: bun run db:migrate

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bunx --bun @biomejs/biome check src drizzle.config.ts vitest.config.ts

      - name: Test
        run: bun run test
